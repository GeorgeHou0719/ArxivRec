[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-rec"
version = "0.1.0"
description = "A local, explainable arXiv paper recommendation system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "openai>=2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "rank-bm25>=0.2.2,<0.3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
arxiv-rec = "arxiv_rec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["arxiv_rec"]

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "rank_bm25", "rank_bm25.*", "streamlit", "streamlit.*"]
follow_imports = "skip"
ignore_missing_imports = true
